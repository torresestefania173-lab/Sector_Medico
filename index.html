<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Triage Médico Rápido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">

    <div class="container">

        <h2 class="text-danger border-bottom pb-2"> Panel de Triage - Urgencias</h2>

        <div class="row mt-4">

            <div class="col-md-4">

                <div class="card shadow-sm p-3">

                    <h4>Nuevo Ingreso</h4>

                    <input type="text" id="nombreP" class="form-control mb-2" placeholder="Nombre del paciente">

                    <input type="number" id="oxigenoP" class="form-control mb-2" placeholder="Saturación O2 (%)">

                    <input type="number" id="ritmoP" class="form-control mb-3" placeholder="Frecuencia Cardíaca (lpm)">

                    <button id="btnRegistrar" class="btn btn-danger w-100">Registrar Signos</button>

                </div>

            </div>

            <div class="col-md-8">

                <table class="table table-hover bg-white shadow-sm">

                    <thead class="table-dark">

                        <tr>

                            <th>Paciente</th>

                            <th>O2 (%)</th>

                            <th>Frec. Cardíaca</th>

                            <th>Prioridad (Triage)</th>

                        </tr>

                    </thead>

                    <tbody id="listaPacientes">

                        <!-- JS inyectará los pacientes aquí -->

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="./JS/funcion.js"></script>

</body>

</html>
